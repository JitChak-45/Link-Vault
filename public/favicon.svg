<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />
  
  <!-- Subtle futuristic circuit grid accent -->
  <path d="M120 80 L392 80 M120 432 L392 432" stroke="#1E293B" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="168" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6" opacity="0.3" />

  <!-- Vault Shackle (Top Arch) -->
  <path d="M196 220 V168 C196 134.86 222.86 108 256 108 C289.14 108 316 134.86 316 168 V220" 
        stroke="url(#primaryGrad)" stroke-width="32" stroke-linecap="round" fill="none" filter="url(#glow)" />
  
  <!-- Interlocking Link Rings forming a Vault -->
  <!-- Left Link Loop -->
  <rect x="144" y="216" width="132" height="148" rx="44" 
        stroke="url(#cyanGrad)" stroke-width="26" fill="none" transform="rotate(-15 210 290)" />

  <!-- Right Link Loop -->
  <rect x="236" y="216" width="132" height="148" rx="44" 
        stroke="url(#primaryGrad)" stroke-width="26" fill="none" transform="rotate(15 302 290)" />

  <!-- Glowing Vault Core Center Point -->
  <polygon points="256,242 278,270 278,308 256,326 234,308 234,270" 
           fill="url(#cyanGrad)" filter="url(#glow)" opacity="0.95" />
  <circle cx="256" cy="284" r="7" fill="#FFFFFF" />
</svg>
